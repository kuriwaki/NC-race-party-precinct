  intermediate: "data/intermediate"
  output: "release"
  diagnostics: "data/diagnostics"

manifests:
  inputs: "manifests/inputs.yml"
  outputs: "manifests/outputs.yml"

snapshots:
  voter_file: "2025-08-02"
  sbe_precincts: "SBE_PRECINCTS_20250225"

inputs:
  voter_root: "ncvoter_2025-08-02"
